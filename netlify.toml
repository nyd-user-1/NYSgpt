# Netlify build of the Next.js app (2026-11-03). Production stays on Amplify.
# The plugin is declared, not auto-detected: on this API-created site the first
# build ran with no plugins and published .next as static files — every route
# 404 (deploy 6aea2f08, plugins: none, "No functions deployed").
[build]
command = "pnpm run build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

# The compile needs more heap than Node's default — the same ceiling that killed the Cloudflare
# runner (run 41929587548); GitHub's next-build.yml already carries this value.
[build.environment]
NODE_OPTIONS = "--max-old-space-size=6144"
